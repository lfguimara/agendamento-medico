
name: CI - Agendamento Médico

on:
  push:
    branches: main
  pull_request:
    branches: main

permissions:
  contents: read

jobs:
  ci:
    name: Validar aplicação
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: agendamento
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d agendamento"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://app:app@localhost:5432/agendamento_test?schema=public

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Auditar dependências
        run: npm audit --audit-level=high

      - name: Verificar tipos TypeScript
        run: npx tsc --noEmit

      - name: Executar testes unitários
        run: npm test

      - name: Criar banco de testes
        run: |
          PGPASSWORD=app psql \
            -h localhost \
            -U app \
            -d agendamento \
            -c "CREATE DATABASE agendamento_test"
      
      - name: Executar testes de integração
        run: npm run test:integration

      - name: Compilar aplicação
        run: npm run build

      - name: Construir imagem Docker
        run: docker build --target runtime -t agendamento-medico:ci .

  publish:
    name: Publicar imagem Docker
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar tags e metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Construir e publicar imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max