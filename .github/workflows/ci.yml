
name: CI - Agendamento Médico

on:
  push:
    branches: main
  pull_request:
    branches: main

permissions:
  contents: read

jobs:
  ci:
    name: Validar aplicação
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: agendamento
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d agendamento"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://app:app@localhost:5432/agendamento_test?schema=public

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Auditar dependências
        run: npm audit --audit-level=high

      - name: Verificar tipos TypeScript
        run: npx tsc --noEmit

      - name: Executar testes unitários
        run: npm test

      - name: Criar banco de testes
        run: |
          PGPASSWORD=app psql \
            -h localhost \
            -U app \
            -d agendamento \
            -c "CREATE DATABASE agendamento_test"
      
      - name: Executar testes de integração
        run: npm run test:integration

      - name: Compilar aplicação
        run: npm run build

      - name: Construir imagem Docker
        run: docker build --target runtime -t agendamento-medico:ci .
