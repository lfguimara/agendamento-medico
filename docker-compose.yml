services:
  db:
    image: postgres:16-alpine
    container_name: agendamento-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: agendamento
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d agendamento"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Aplica as migrations e encerra; a API só sobe depois que ele termina com sucesso
  migrate:
    build:
      context: .
      target: build
    container_name: agendamento-migrate
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/agendamento?schema=public
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runtime
    image: agendamento-medico:latest
    container_name: agendamento-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/agendamento?schema=public
      PORT: 3333
      CORS_ORIGIN: http://localhost:5173,http://localhost:8080
    ports:
      - "3333:3333"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
